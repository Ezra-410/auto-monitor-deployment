# =============================================================================
# CDL · Stage 2a · SECRET CHECK
# Looks for passwords, tokens and private keys in:
#   - the FULL Git history of auto-monitor (a secret deleted later is still
#     in history and still compromised)
#   - this deployment repository
# Tools  : Gitleaks 8.24.3 (history-aware, decodes base64) + Trivy secret scan
# Policy : ANY finding -> FAIL. Exceptions only in security/.gitleaksignore
#          (in THIS repo, so app developers cannot self-approve), and inline
#          "gitleaks:allow" comments are IGNORED on purpose.
# =============================================================================
name: CDL · secret check

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
    secrets:
      AUTO_MONITOR_PAT:
        required: true

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.24.3"
  GITLEAKS_SHA256: "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c"
  TRIVY_VERSION: "0.69.3"
  TRIVY_SHA256: "1816b632dfe529869c740c0913e36bd1629cb7688bd5634f4a858c1d57c88b75"

jobs:
  secrets:
    name: Gitleaks + Trivy secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout deployment repo (full history)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout auto-monitor at the delivered commit (full history)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ vars.APP_REPO }}
          ref: ${{ inputs.source_sha }}
          token: ${{ secrets.AUTO_MONITOR_PAT }}
          path: app
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks + Trivy (checksums verified)
        run: |
          curl -sSfL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gl.tgz" | sha256sum -c -
          tar xzf gl.tgz gitleaks && sudo mv gitleaks /usr/local/bin/
          curl -sSfL -o trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tgz" | sha256sum -c -
          tar xzf trivy.tgz trivy && sudo mv trivy /usr/local/bin/
          rm -f gl.tgz trivy.tgz

      - name: Gitleaks - auto-monitor full history
        id: gl_app
        run: |
          mkdir -p reports
          gitleaks git app \
            --log-opts="--full-history HEAD" \
            --gitleaks-ignore-path security/.gitleaksignore \
            --ignore-gitleaks-allow \
            --redact --verbose \
            --report-format json --report-path reports/gitleaks-app.json \
            --exit-code 1

      - name: Gitleaks - deployment repo full history
        if: always()
        id: gl_deploy
        run: |
          gitleaks git . \
            --gitleaks-ignore-path security/.gitleaksignore \
            --ignore-gitleaks-allow \
            --redact --verbose \
            --report-format json --report-path reports/gitleaks-deploy.json \
            --exit-code 1

      - name: Trivy secret scan - current files (second opinion)
        if: always()
        id: trivy_secret
        run: |
          trivy fs --scanners secret --format table \
            --output reports/trivy-secrets.txt --exit-code 1 app
          cat reports/trivy-secrets.txt

      - name: Keep secret-scan reports (values are redacted)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: secret-scan-report
          path: reports/
          retention-days: 90
