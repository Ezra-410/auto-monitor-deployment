# =============================================================================
# SEC-07 PROBE - copy to .github/workflows/ on branch test/sec-07-secret-probe
# Simulates an attacker (or careless dev) who adds a job that tries to read
# PRODUCTION secrets. Expected result:
#   job A (no environment)            -> production secrets are EMPTY
#   job B (environment: production)   -> REJECTED: branch not allowed to deploy
# The probe prints only the LENGTH of each secret, never the value.
# =============================================================================
name: SEC-07 secret probe

on:
  push:
    branches: ["test/sec-07-*"]

permissions:
  contents: read

jobs:
  probe_without_environment:
    name: "A · Read prod secrets WITHOUT environment"
    runs-on: ubuntu-24.04
    steps:
      - name: Try to read production secrets
        env:
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          for v in JWT_PRIVATE_KEY MYSQL_ROOT_PASSWORD ADMIN_PASSWORD; do
            val="${!v}"
            echo "$v length = ${#val}"
          done
          if [ -z "$JWT_PRIVATE_KEY$MYSQL_ROOT_PASSWORD$ADMIN_PASSWORD" ]; then
            echo "ACCESS DENIED (expected): environment secrets are invisible outside the environment"
          else
            echo "::error::SECURITY FAILURE: a job without environment could read production secrets"
            exit 1
          fi

  probe_with_environment:
    name: "B · Claim the production environment from a test branch"
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Should never run
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: echo "::error::SECURITY FAILURE - production environment reached from a test branch (length ${#ADMIN_PASSWORD})"
